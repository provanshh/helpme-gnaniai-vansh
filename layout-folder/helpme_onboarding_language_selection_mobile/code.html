<style data-purpose="map-and-animations">
    /* 3D Map Perspective Simulation */
    .perspective-map-container {
      perspective: 800px;
    }
    .tilted-map {
      transform: rotateX(24deg) scale(1.08);
      transform-origin: center bottom;
      transition: transform 0.4s ease;
    }

    /* Radar Beacon Pulse */
    @keyframes pulse-ring {
      0% {
        transform: scale(0.6);
        opacity: 0.9;
      }
      80%, 100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }
    .pulse-ring-effect {
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    /* Audio Soundwave animation */
    @keyframes wave-bar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-line-1 { animation: wave-bar 1s ease-in-out infinite 0.1s; }
    .wave-line-2 { animation: wave-bar 0.9s ease-in-out infinite 0.25s; }
    .wave-line-3 { animation: wave-bar 1.2s ease-in-out infinite 0.4s; }
    .wave-line-4 { animation: wave-bar 0.8s ease-in-out infinite 0.15s; }

    /* Hide scrollbar for clean app shell feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
